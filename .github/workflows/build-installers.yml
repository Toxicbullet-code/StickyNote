name: Build Native Desktop Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile Java Code & Build JAR
        run: |
          mkdir -p out
          javac -d out src/*.java
          jar cfe StickyNote.jar Main -C out .

      # Windows (.msi)
      - name: Generate Windows Installer
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p dist
          jpackage --type msi --name StickyNote --input . --main-jar StickyNote.jar --main-class Main --dest dist/

      # macOS (.dmg)
      - name: Generate Mac Installer
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist
          jpackage --type dmg --name StickyNote --input . --main-jar StickyNote.jar --main-class Main --dest dist/

      # Linux (.AppImage)
      - name: Generate Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 1. Install libfuse2 required by appimagetool
          sudo apt-get update
          sudo apt-get install -y libfuse2

          # 2. Extract app-image structure from jpackage
          jpackage --type app-image --name StickyNote --input . --main-jar StickyNote.jar --main-class Main --dest dist/
          
          # 3. Setup desktop & entrypoint metadata
          mkdir -p dist/StickyNote/usr/share/applications
          echo -e "[Desktop Entry]\nType=Application\nName=StickyNote\nExec=StickyNote\nIcon=utilities-notes\nCategories=Utility;" > dist/StickyNote/StickyNote.desktop
          ln -s usr/share/applications/StickyNote.desktop dist/StickyNote/StickyNote.desktop
          
          mkdir -p dist/StickyNote/usr/share/icons/hicolor/256x256/apps
          touch dist/StickyNote/StickyNote.png
          ln -s usr/share/icons/hicolor/256x256/apps/StickyNote.png dist/StickyNote/StickyNote.png

          echo -e '#!/bin/sh\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "$HERE/bin/StickyNote" "$@"' > dist/StickyNote/AppRun
          chmod +x dist/StickyNote/AppRun

          # 4. Fetch appimagetool and generate AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run dist/StickyNote StickyNote-x86_64.AppImage

          mkdir -p final_dist
          mv StickyNote-x86_64.AppImage final_dist/

      - name: Upload Installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msi
            dist/*.dmg
            final_dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}