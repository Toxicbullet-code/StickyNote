name: Build Native Desktop Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: StickyNote.msi
          - os: macos-latest
            artifact: StickyNote.dmg
          - os: ubuntu-latest
            artifact: StickyNote.AppImage

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile Java Code & Build JAR
        run: |
          mkdir -p out
          javac -d out src/*.java
          jar cfe StickyNote.jar Main -C out .

      # Windows (.msi)
      - name: Build Windows Installer
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p dist
          jpackage --type msi --name StickyNote --input . --main-jar StickyNote.jar --main-class Main --dest dist/

      # macOS (.dmg)
      - name: Build Mac Installer
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist
          jpackage --type dmg --name StickyNote --input . --main-jar StickyNote.jar --main-class Main --dest dist/

      # Linux (.AppImage)
      - name: Build Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 1. Create app directory structure via jpackage
          jpackage --type app-image --name StickyNote --input . --main-jar StickyNote.jar --main-class Main --dest dist/

          # 2. Generate desktop entry directly in AppDir root
          cat << 'EOF' > dist/StickyNote/StickyNote.desktop
  [Desktop Entry]
  Type=Application
  Name=StickyNote
  Exec=StickyNote
  Icon=StickyNote
  Categories=Utility;
  EOF
  
  # 3. Generate valid PNG icon via Python (bypasses shell base64 syntax issues)
  python3 -c "import base64; open('dist/StickyNote/StickyNote.png', 'wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='))"
  
  # 4. Generate AppRun execution wrapper directly in AppDir root
  cat << 'EOF' > dist/StickyNote/AppRun
  #!/bin/sh
  HERE="$(dirname "$(readlink -f "${0}")")"
  exec "$HERE/bin/StickyNote" "$@"
  EOF
  chmod +x dist/StickyNote/AppRun
  
  # 5. Fetch pinned appimagetool binary and package AppImage
  curl -sSL https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage -o appimagetool
  chmod +x appimagetool
  ./appimagetool --appimage-extract
  ARCH=x86_64 ./squashfs-root/AppRun dist/StickyNote dist/StickyNote.AppImage

- name: Upload Installer to Release
  uses: softprops/action-gh-release@v2
  with:
    files: dist/${{ matrix.artifact }}
  env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}