name: Build Native Desktop Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: StickyNote.msi
          - os: macos-latest
            artifact: StickyNote.dmg
          - os: ubuntu-latest
            artifact: StickyNote.AppImage

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile Java Code & Build JAR
        run: |
          mkdir -p out
          javac -d out src/*.java
          jar cfe StickyNote.jar Main -C out .

      # Windows (.msi)
      - name: Build Windows Installer
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p dist
          jpackage --type msi --name StickyNote --input . --main-jar StickyNote.jar --main-class Main --dest dist/

      # macOS (.dmg)
      - name: Build Mac Installer
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist
          jpackage --type dmg --name StickyNote --input . --main-jar StickyNote.jar --main-class Main --dest dist/

      # Linux (.AppImage)
      - name: Build Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 1. Install FUSE & SquashFS system libraries on runner
          sudo apt-get update -qq
          sudo apt-get install -y libfuse2 squashfs-tools

          # 2. Generate raw app directory structure via jpackage
          jpackage --type app-image --name StickyNote --input . --main-jar StickyNote.jar --main-class Main --dest dist/

          # 3. Create desktop entry file directly inside AppDir root
          printf "[Desktop Entry]\nType=Application\nName=StickyNote\nExec=StickyNote\nIcon=StickyNote\nCategories=Utility;\n" > dist/StickyNote/StickyNote.desktop

          # 4. Write valid PNG icon header via Python
          python3 -c "import base64; open('dist/StickyNote/StickyNote.png', 'wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='))"

          # 5. Create AppRun entrypoint script
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "$HERE/bin/StickyNote" "$@"\n' > dist/StickyNote/AppRun
          chmod +x dist/StickyNote/AppRun

          # 6. Download appimagetool, extract squashfs payload, and generate AppImage
          curl -sSL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool

          ./appimagetool --appimage-extract
          export ARCH=x86_64
          ./squashfs-root/AppRun dist/StickyNote dist/StickyNote.AppImage

      - name: Upload Installer to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}