name: Build Native Desktop Installers

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pkg_type: msi
          - os: macos-latest
            pkg_type: dmg
          - os: ubuntu-latest
            pkg_type: deb

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile Java Code & Build JAR
        run: |
          mkdir -p out
          javac -d out src/*.java
          jar cfe StickyNote.jar Main -C out .

      - name: Generate Native Installer
        run: |
          mkdir -p dist
          jpackage --type ${{ matrix.pkg_type }} --name StickyNote --input . --main-jar StickyNote.jar --main-class Main --dest dist/

      - name: Upload Installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}