name: Build Native Desktop Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: StickyNote.msi
          - os: macos-latest
            artifact: StickyNote.dmg
          - os: ubuntu-latest
            artifact: StickyNote.AppImage

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile Java Code & Build JAR
        run: |
          mkdir -p out
          javac -d out src/*.java
          jar cfe StickyNote.jar Main -C out .

      # Windows (.msi)
      - name: Build Windows Installer
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p dist
          jpackage --type msi --name StickyNote --input . --main-jar StickyNote.jar --main-class Main --dest dist/

      # macOS (.dmg)
      - name: Build Mac Installer
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist
          jpackage --type dmg --name StickyNote --input . --main-jar StickyNote.jar --main-class Main --dest dist/

      # Linux (.AppImage)
      - name: Build Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 1. Create app directory structure via jpackage
          jpackage --type app-image --name StickyNote --input . --main-jar StickyNote.jar --main-class Main --dest dist/

          # 2. Setup desktop entry, icon, and AppRun inside dist/StickyNote
          echo "[Desktop Entry]" > dist/StickyNote/StickyNote.desktop
          echo "Type=Application" >> dist/StickyNote/StickyNote.desktop
          echo "Name=StickyNote" >> dist/StickyNote/StickyNote.desktop
          echo "Exec=StickyNote" >> dist/StickyNote/StickyNote.desktop
          echo "Icon=StickyNote" >> dist/StickyNote/StickyNote.desktop
          echo "Categories=Utility;" >> dist/StickyNote/StickyNote.desktop

          python3 -c "import base64; open('dist/StickyNote/StickyNote.png', 'wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='))"

          echo '#!/bin/sh' > dist/StickyNote/AppRun
          echo 'HERE="$(dirname "$(readlink -f "${0}")")"' >> dist/StickyNote/AppRun
          echo 'exec "$HERE/bin/StickyNote" "$@"' >> dist/StickyNote/AppRun
          chmod +x dist/StickyNote/AppRun

          # 3. Download appimagetool and unpack directly
          curl -sSL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract

          # 4. Execute extracted tool directly (no FUSE or /tmp mount required)
          export ARCH=x86_64
          ./squashfs-root/AppRun -n dist/StickyNote dist/StickyNote.AppImage

      - name: Upload Installer to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}