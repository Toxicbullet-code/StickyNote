name: Build Native Desktop Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile Java Code & Build JAR
        run: |
          mkdir -p out
          javac -d out src/*.java
          jar cfe StickyNote.jar Main -C out .

      # Windows (.msi)
      - name: Generate Windows Installer
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p dist
          jpackage --type msi --name StickyNote --input . --main-jar StickyNote.jar --main-class Main --dest dist/

      # macOS (.dmg)
      - name: Generate Mac Installer
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist
          jpackage --type dmg --name StickyNote --input . --main-jar StickyNote.jar --main-class Main --dest dist/

      # Linux (.AppImage)
      - name: Generate Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 1. Ask jpackage for raw app directory structure
          jpackage --type app-image --name StickyNote --input . --main-jar StickyNote.jar --main-class Main --dest dist/
          
          # 2. Setup standard AppDir entrypoint and desktop configuration
          mkdir -p dist/StickyNote/usr/share/applications
          cat << 'EOF' > dist/StickyNote/StickyNote.desktop
    [Desktop Entry]
    Type=Application
    Name=StickyNote
    Exec=StickyNote
    Icon=StickyNote
    Categories=Utility;
    EOF
    ln -s usr/share/applications/StickyNote.desktop dist/StickyNote/StickyNote.desktop
    
    # Create valid 1x1 PNG icon (valid header so appimagetool passes image check)
    mkdir -p dist/StickyNote/usr/share/icons/hicolor/256x256/apps
    echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > dist/StickyNote/usr/share/icons/hicolor/256x256/apps/StickyNote.png
    ln -s usr/share/icons/hicolor/256x256/apps/StickyNote.png dist/StickyNote/StickyNote.png
    
    # AppRun execution launcher
    cat << 'EOF' > dist/StickyNote/AppRun
    #!/bin/sh
    HERE="$(dirname "$(readlink -f "${0}")")"
    exec "$HERE/bin/StickyNote" "$@"
    EOF
    chmod +x dist/StickyNote/AppRun
    
    # 3. Download and extract appimagetool (bypasses FUSE)
    wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
    chmod +x appimagetool-x86_64.AppImage
    ./appimagetool-x86_64.AppImage --appimage-extract
    
    # 4. Pack into AppImage with explicit ARCH env
    mkdir -p final_dist
    ARCH=x86_64 ./squashfs-root/AppRun dist/StickyNote final_dist/StickyNote-x86_64.AppImage

    - name: Upload Installers to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.msi
          dist/*.dmg
          final_dist/*.AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}