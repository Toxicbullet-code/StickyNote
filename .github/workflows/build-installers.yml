name: Build Native Desktop Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: |
          mkdir out
          mkdir jar_input
          javac -d out src/*.java
          jar cfe jar_input/StickyNote.jar Main -C out .
          mkdir dist
          jpackage --type msi --name StickyNote --input jar_input --main-jar StickyNote.jar --main-class Main --dest dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.msi

  build-mac:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: |
          mkdir out
          mkdir jar_input
          javac -d out src/*.java
          jar cfe jar_input/StickyNote.jar Main -C out .
          mkdir dist
          jpackage --type dmg --name StickyNote --input jar_input --main-jar StickyNote.jar --main-class Main --dest dist/
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: dist/*.dmg

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: |
          mkdir out
          mkdir jar_input
          javac -d out src/*.java
          jar cfe jar_input/StickyNote.jar Main -C out .
          
          sudo apt-get update -qq
          sudo apt-get install -y file squashfs-tools desktop-file-utils
          
          mkdir dist
          jpackage --type app-image --name StickyNote --input jar_input --main-jar StickyNote.jar --main-class Main --dest dist/
          
          printf "[Desktop Entry]\nType=Application\nName=StickyNote\nExec=StickyNote\nIcon=StickyNote\nCategories=Utility;\n" > dist/StickyNote/StickyNote.desktop
          python3 -c "import base64; open('dist/StickyNote/StickyNote.png', 'wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='))"
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "$HERE/bin/StickyNote" "$@"\n' > dist/StickyNote/AppRun
          chmod +x dist/StickyNote/AppRun
          
          curl -sSL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          
          export ARCH=x86_64
          ./squashfs-root/AppRun -n dist/StickyNote dist/StickyNote.AppImage
          chmod +x dist/StickyNote.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/*.AppImage

  release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Upload All to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}